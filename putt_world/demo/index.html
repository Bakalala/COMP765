<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Putt World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="board" id="board" aria-label="Mini-golf course">
    <canvas id="course" aria-label="Top-down mini-golf course. Drag back from the ball to aim and set power, then release."></canvas>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <aside class="card">
    <header>
      <h1>Putt World</h1>
      <p class="tagline">A small world model learned this game from pixels. Does it know about the walls?</p>
    </header>

    <nav class="courses" id="courses" aria-label="Choose a course"></nav>

    <div class="score">
      <div class="tally"><span class="big" id="shots">0</span><span class="label" id="shots-label">shots</span></div>
      <div class="split">
        <span>You <b id="shots-you">0</b></span>
        <span>Model <b id="shots-model">0</b></span>
      </div>
      <button class="reset" id="reset" type="button">Reset</button>
    </div>

    <div class="agent">
      <button class="plan" id="plan" type="button">Let the world model plan</button>
      <p class="model-note" id="model-note"></p>
      <fieldset class="modes">
        <legend>How the model scores a spot</legend>
        <label><input type="radio" name="mode" value="latent" checked><span>Straight-line latent distance</span></label>
        <label><input type="radio" name="mode" value="graph"><span>Shot graph (Dyna)</span></label>
      </fieldset>
      <label class="switch">
        <input type="checkbox" id="mind">
        <span class="track" aria-hidden="true"></span>
        <span>Mind view</span>
      </label>
      <div class="legend" id="legend" hidden>
        <div class="legend-title" id="legend-title"></div>
        <div class="legend-bar"><span class="legend-marker" id="legend-marker" title="The ball"></span></div>
        <div class="legend-ends"><span id="legend-low"></span><span id="legend-high"></span></div>
      </div>
    </div>

    <p class="caption" id="caption"></p>
  </aside>
</main>
<script src="golf.js"></script>
<script src="planner.js"></script>
<script src="model_data.js" onerror="window.PUTT_MODEL = window.PUTT_MODEL || null"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
